name: "HestiaCP Backup"
description: "Create backups using HestiaCP native commands (v-backup-user)"
author: "RelyBytes"
branding:
  icon: "archive"
  color: "orange"

inputs:
  host:
    description: "SSH host address"
    required: true
  port:
    description: "SSH port"
    required: false
    default: "22"
  username:
    description: "SSH username (must have permission to run Hestia commands)"
    required: true
  private_key:
    description: "SSH private key"
    required: true
  hestia_user:
    description: "HestiaCP user to backup"
    required: true
  retention:
    description: "Number of backups to keep (older ones will be deleted)"
    required: false
    default: "7"
  notify:
    description: "Send HestiaCP email notification after backup (yes/no)"
    required: false
    default: "no"

outputs:
  backup_name:
    description: "Name of the created backup file"
    value: ${{ steps.backup.outputs.backup_name }}
  backup_path:
    description: "Full path to the created backup file"
    value: ${{ steps.backup.outputs.backup_path }}
  backup_size:
    description: "Size of backup in bytes"
    value: ${{ steps.backup.outputs.backup_size }}
  backup_duration:
    description: "Backup duration in seconds"
    value: ${{ steps.backup.outputs.backup_duration }}
  backups_removed:
    description: "Number of old backups removed"
    value: ${{ steps.retention.outputs.backups_removed }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_HOST: ${{ inputs.host }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PRIVATE_KEY: ${{ inputs.private_key }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_HESTIA_USER: ${{ inputs.hestia_user }}
        INPUT_RETENTION: ${{ inputs.retention }}
      run: |
        echo "::group::Validating inputs"

        if [[ -z "$INPUT_HOST" ]]; then
          echo "::error::host is required"
          exit 1
        fi

        if [[ -z "$INPUT_USERNAME" ]]; then
          echo "::error::username is required"
          exit 1
        fi

        if [[ -z "$INPUT_PRIVATE_KEY" ]]; then
          echo "::error::private_key is required"
          exit 1
        fi

        if [[ -z "$INPUT_HESTIA_USER" ]]; then
          echo "::error::hestia_user is required"
          exit 1
        fi

        if [[ ! "$INPUT_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]; then
          echo "::error::Invalid host format"
          exit 1
        fi

        if ! [[ "$INPUT_PORT" =~ ^[0-9]+$ ]] || [[ "$INPUT_PORT" -lt 1 ]] || [[ "$INPUT_PORT" -gt 65535 ]]; then
          echo "::error::Port must be between 1 and 65535"
          exit 1
        fi

        if ! [[ "$INPUT_RETENTION" =~ ^[0-9]+$ ]] || [[ "$INPUT_RETENTION" -lt 1 ]]; then
          echo "::error::retention must be a positive integer"
          exit 1
        fi

        echo "Inputs validated"
        echo "::endgroup::"

    - name: Setup SSH connection
      shell: bash
      env:
        PRIVATE_KEY: ${{ inputs.private_key }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_USER: ${{ inputs.username }}
      run: |
        echo "::group::Setting up SSH connection"

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/backup_key
        chmod 600 ~/.ssh/backup_key

        {
          echo "Host backup_target"
          echo "  HostName $INPUT_HOST"
          echo "  Port $INPUT_PORT"
          echo "  User $INPUT_USER"
          echo "  IdentityFile ~/.ssh/backup_key"
          echo "  StrictHostKeyChecking no"
          echo "  UserKnownHostsFile /dev/null"
          echo "  ConnectTimeout 30"
        } >> ~/.ssh/config
        chmod 600 ~/.ssh/config

        echo "SSH configuration completed"
        echo "::endgroup::"

    - name: Test SSH connection
      shell: bash
      run: |
        echo "::group::Testing SSH connection"

        if ! ssh backup_target "echo 'SSH connection successful'" 2>/dev/null; then
          echo "::error::Failed to establish SSH connection"
          exit 1
        fi

        echo "SSH connection verified"
        echo "::endgroup::"

    - name: Create backup
      id: backup
      shell: bash
      env:
        INPUT_HESTIA_USER: ${{ inputs.hestia_user }}
        INPUT_NOTIFY: ${{ inputs.notify }}
      run: |
        echo "::group::Creating HestiaCP backup"

        BACKUP_START=$(date +%s)

        NOTIFY_FLAG=""
        if [[ "$INPUT_NOTIFY" == "yes" ]]; then
          NOTIFY_FLAG="yes"
        fi

        echo "Running v-backup-user for user: $INPUT_HESTIA_USER"

        if ! ssh backup_target "v-backup-user '$INPUT_HESTIA_USER' $NOTIFY_FLAG"; then
          echo "::error::v-backup-user failed"
          exit 1
        fi

        BACKUP_END=$(date +%s)
        BACKUP_DURATION=$((BACKUP_END - BACKUP_START))

        # Retrieve the latest backup created for this user
        BACKUP_NAME=$(ssh backup_target "ls -t /backup/${INPUT_HESTIA_USER}.*.tar 2>/dev/null | head -1 | xargs basename 2>/dev/null" || echo "")
        if [[ -z "$BACKUP_NAME" ]]; then
          echo "::error::Could not find created backup file in /backup/"
          exit 1
        fi

        BACKUP_PATH="/backup/$BACKUP_NAME"
        BACKUP_SIZE=$(ssh backup_target "stat -c%s '$BACKUP_PATH' 2>/dev/null || echo '0'")

        echo "backup_name=$BACKUP_NAME" >> "$GITHUB_OUTPUT"
        echo "backup_path=$BACKUP_PATH" >> "$GITHUB_OUTPUT"
        echo "backup_size=$BACKUP_SIZE" >> "$GITHUB_OUTPUT"
        echo "backup_duration=$BACKUP_DURATION" >> "$GITHUB_OUTPUT"

        echo "Backup created: $BACKUP_NAME"
        echo "Size: $BACKUP_SIZE bytes"
        echo "Duration: ${BACKUP_DURATION}s"
        echo "::endgroup::"

    - name: Apply retention policy
      id: retention
      shell: bash
      env:
        INPUT_HESTIA_USER: ${{ inputs.hestia_user }}
        INPUT_RETENTION: ${{ inputs.retention }}
      run: |
        echo "::group::Applying retention policy (keep $INPUT_RETENTION backups)"

        # List all backups for the user, sorted newest first (plain text: one filename per line)
        BACKUP_LIST=$(ssh backup_target "v-list-user-backups '$INPUT_HESTIA_USER' plain 2>/dev/null | awk '{print \$1}' | sort -r")

        TOTAL=$(echo "$BACKUP_LIST" | grep -c '.' || echo "0")
        echo "Total backups found: $TOTAL"

        REMOVED=0
        LINE=0
        while IFS= read -r BACKUP_FILE; do
          [[ -z "$BACKUP_FILE" ]] && continue
          LINE=$((LINE + 1))
          if [[ "$LINE" -gt "$INPUT_RETENTION" ]]; then
            echo "Deleting old backup: $BACKUP_FILE"
            if ssh backup_target "v-delete-user-backup '$INPUT_HESTIA_USER' '$BACKUP_FILE'"; then
              REMOVED=$((REMOVED + 1))
            else
              echo "::warning::Failed to delete backup: $BACKUP_FILE"
            fi
          fi
        done <<< "$BACKUP_LIST"

        echo "backups_removed=$REMOVED" >> "$GITHUB_OUTPUT"
        echo "Retention applied — removed $REMOVED old backup(s)"
        echo "::endgroup::"

    - name: Output summary
      shell: bash
      env:
        INPUT_HESTIA_USER: ${{ inputs.hestia_user }}
      run: |
        echo "::group::Backup summary"

        BACKUP_NAME="${{ steps.backup.outputs.backup_name }}"
        BACKUP_SIZE="${{ steps.backup.outputs.backup_size }}"
        BACKUP_DURATION="${{ steps.backup.outputs.backup_duration }}"
        BACKUPS_REMOVED="${{ steps.retention.outputs.backups_removed }}"

        echo "HestiaCP backup completed successfully!"
        echo "User:     $INPUT_HESTIA_USER"
        echo "Backup:   $BACKUP_NAME"
        echo "Size:     $BACKUP_SIZE bytes"
        echo "Duration: ${BACKUP_DURATION}s"
        echo "Removed:  $BACKUPS_REMOVED old backup(s)"

        {
          echo "## HestiaCP Backup Summary"
          echo "**User:** $INPUT_HESTIA_USER"
          echo "**Backup:** $BACKUP_NAME"
          echo "**Size:** $BACKUP_SIZE bytes"
          echo "**Duration:** ${BACKUP_DURATION}s"
          echo "**Old backups removed:** $BACKUPS_REMOVED"
        } >> "$GITHUB_STEP_SUMMARY"

        echo "::endgroup::"

    - name: Cleanup SSH
      shell: bash
      if: always()
      run: |
        echo "::group::Cleanup SSH"
        rm -f ~/.ssh/backup_key
        echo "SSH cleanup completed"
        echo "::endgroup::"

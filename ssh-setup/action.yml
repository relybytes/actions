name: "SSH Setup"
description: "Setup reusable SSH connections for GitHub Actions workflows"
author: "RelyBytes"
branding:
  icon: "shield"
  color: "green"

inputs:
  host:
    description: "SSH host address"
    required: true
  port:
    description: "SSH port"
    required: false
    default: "22"
  username:
    description: "SSH username"
    required: true
  private_key:
    description: "SSH private key"
    required: true
  known_hosts:
    description: "Known hosts content (optional)"
    required: false
    default: ""
  connection_alias:
    description: "SSH connection alias for later use"
    required: false
    default: "deploy_target"
  timeout:
    description: "Connection timeout in seconds"
    required: false
    default: "30"

outputs:
  connection_alias:
    description: "SSH connection alias"
    value: ${{ steps.test.outputs.connection_alias }}
  connection_test:
    description: "Connection test result"
    value: ${{ steps.test.outputs.connection_test }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_HOST: ${{ inputs.host }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PRIVATE_KEY: ${{ inputs.private_key }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_ALIAS: ${{ inputs.connection_alias }}
      run: |
        echo "::group::Validating inputs"

        if [[ -z "$INPUT_HOST" ]]; then
          echo "::error::Host is required"
          exit 1
        fi

        if [[ -z "$INPUT_USERNAME" ]]; then
          echo "::error::Username is required"
          exit 1
        fi

        if [[ -z "$INPUT_PRIVATE_KEY" ]]; then
          echo "::error::Private key is required"
          exit 1
        fi

        if [[ ! "$INPUT_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]; then
          echo "::error::Invalid host format"
          exit 1
        fi

        if ! [[ "$INPUT_PORT" =~ ^[0-9]+$ ]] || [[ "$INPUT_PORT" -lt 1 ]] || [[ "$INPUT_PORT" -gt 65535 ]]; then
          echo "::error::Port must be between 1 and 65535"
          exit 1
        fi

        if [[ ! "$INPUT_ALIAS" =~ ^[a-zA-Z0-9_-]+$ ]]; then
          echo "::error::connection_alias must contain only alphanumeric characters, hyphens, or underscores"
          exit 1
        fi

        echo "Inputs validated successfully"
        echo "::endgroup::"

    - name: Setup SSH directory
      shell: bash
      run: |
        echo "::group::Setting up SSH directory"
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "SSH directory created: ~/.ssh"
        echo "::endgroup::"

    - name: Setup SSH key
      shell: bash
      env:
        PRIVATE_KEY: ${{ inputs.private_key }}
      run: |
        echo "::group::Setting up SSH key"

        printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
          echo "::error::Invalid SSH private key format"
          rm -f ~/.ssh/deploy_key
          exit 1
        fi

        echo "SSH key configured successfully"
        echo "Key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key)"
        echo "::endgroup::"

    - name: Setup known hosts
      shell: bash
      env:
        KNOWN_HOSTS_CONTENT: ${{ inputs.known_hosts }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_PORT: ${{ inputs.port }}
      run: |
        echo "::group::Setting up known hosts"

        touch ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

        if [[ -n "$KNOWN_HOSTS_CONTENT" ]]; then
          printf '%s\n' "$KNOWN_HOSTS_CONTENT" > ~/.ssh/known_hosts
          echo "SSH_STRICT_HOST_CHECKING=yes" >> "$GITHUB_ENV"
          echo "Using provided known_hosts"
        else
          echo "Scanning host key for $INPUT_HOST:$INPUT_PORT"
          ssh-keygen -R "$INPUT_HOST" -f ~/.ssh/known_hosts 2>/dev/null || true
          if ssh-keyscan -p "$INPUT_PORT" "$INPUT_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Host key scanned and added"
            echo "SSH_STRICT_HOST_CHECKING=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::Failed to scan host key, will use StrictHostKeyChecking=accept-new"
            echo "SSH_STRICT_HOST_CHECKING=accept-new" >> "$GITHUB_ENV"
          fi
        fi

        echo "Known hosts configured"
        echo "::endgroup::"

    - name: Create SSH config
      shell: bash
      env:
        INPUT_ALIAS: ${{ inputs.connection_alias }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_USER: ${{ inputs.username }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
      run: |
        echo "::group::Creating SSH config"

        STRICT_CHECK="${SSH_STRICT_HOST_CHECKING:-accept-new}"
        if [[ "$STRICT_CHECK" == "yes" ]]; then
          KNOWN_HOSTS_LINE="  UserKnownHostsFile ~/.ssh/known_hosts"
        else
          KNOWN_HOSTS_LINE="  UserKnownHostsFile /dev/null"
        fi

        {
          echo "Host $INPUT_ALIAS"
          echo "  HostName $INPUT_HOST"
          echo "  Port $INPUT_PORT"
          echo "  User $INPUT_USER"
          echo "  IdentityFile ~/.ssh/deploy_key"
          echo "  StrictHostKeyChecking $STRICT_CHECK"
          echo "$KNOWN_HOSTS_LINE"
          echo "  ConnectTimeout $INPUT_TIMEOUT"
        } > ~/.ssh/config

        chmod 600 ~/.ssh/config
        echo "SSH config created for alias: $INPUT_ALIAS (StrictHostKeyChecking=$STRICT_CHECK)"
        echo "::endgroup::"

    - name: Test SSH connection
      id: test
      shell: bash
      env:
        INPUT_HOST: ${{ inputs.host }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_USER: ${{ inputs.username }}
      run: |
        echo "::group::Testing SSH connection"

        CONNECTION_ALIAS="${{ inputs.connection_alias }}"
        TIMEOUT="${{ inputs.timeout }}"

        echo "Testing connection to $INPUT_HOST:$INPUT_PORT as $INPUT_USER"
        echo "Timeout: ${TIMEOUT}s"

        if ! timeout "$TIMEOUT" ssh "$CONNECTION_ALIAS" "echo 'SSH connection successful'" 2>/dev/null; then
          echo "::error::SSH connection test failed"
          echo "Please verify:"
          echo "  - Host address and port are correct"
          echo "  - SSH credentials are valid"
          echo "  - Network connectivity"
          echo "  - SSH server is running and accessible"
          exit 1
        fi

        REMOTE_USER=$(ssh "$CONNECTION_ALIAS" "whoami" 2>/dev/null)
        REMOTE_HOSTNAME=$(ssh "$CONNECTION_ALIAS" "hostname" 2>/dev/null)

        echo "Connection test successful!"
        echo "Remote user: $REMOTE_USER"
        echo "Remote hostname: $REMOTE_HOSTNAME"

        echo "connection_alias=${CONNECTION_ALIAS}" >> $GITHUB_OUTPUT
        echo "connection_test=success" >> $GITHUB_OUTPUT

        echo "::endgroup::"

    - name: Setup environment variables
      shell: bash
      env:
        INPUT_ALIAS: ${{ inputs.connection_alias }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_USER: ${{ inputs.username }}
      run: |
        echo "::group::Setting up environment variables"

        echo "SSH_ALIAS=$INPUT_ALIAS" >> "$GITHUB_ENV"
        echo "SSH_HOST=$INPUT_HOST" >> "$GITHUB_ENV"
        echo "SSH_PORT=$INPUT_PORT" >> "$GITHUB_ENV"
        echo "SSH_USER=$INPUT_USER" >> "$GITHUB_ENV"

        echo "Environment variables set:"
        echo "  SSH_ALIAS=$INPUT_ALIAS"
        echo "  SSH_HOST=$INPUT_HOST"
        echo "  SSH_PORT=$INPUT_PORT"
        echo "  SSH_USER=$INPUT_USER"

        echo "::endgroup::"

    - name: Output connection info
      shell: bash
      env:
        INPUT_ALIAS: ${{ inputs.connection_alias }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_USER: ${{ inputs.username }}
      run: |
        echo "::group::Connection information"

        echo "SSH connection is ready for use!"
        echo ""
        echo "Usage examples:"
        echo "  ssh $INPUT_ALIAS 'ls -la'"
        echo "  scp $INPUT_ALIAS:remote/file ./local/file"
        echo "  rsync -avz ./local/ $INPUT_ALIAS:remote/"
        echo ""
        echo "Connection alias: $INPUT_ALIAS"
        echo "Host: $INPUT_HOST:$INPUT_PORT"
        echo "User: $INPUT_USER"

        echo "::endgroup::"
